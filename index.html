<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#05070d;
  --surface:#0c0f18;
  --lift:#12172a;
  --line:rgba(255,255,255,0.06);
  --snow:#eef0f8;
  --dim:#3e4560;
  --wa:#25D366;
  --wa-lo:rgba(37,211,102,0.1);
  --wa-md:rgba(37,211,102,0.22);
  --r:18px;
}
html,body{height:100%}
body{
  background:var(--bg);
  font-family:'Outfit',sans-serif;
  color:var(--snow);
  display:flex;
  justify-content:center;
  overflow-x:hidden;
  min-height:100vh;
}
#cv{position:fixed;inset:0;z-index:0;pointer-events:none}
main{
  position:relative;z-index:1;
  width:100%;max-width:420px;
  padding:64px 22px 56px;
  display:flex;flex-direction:column;align-items:center;
}
.top{display:flex;flex-direction:column;align-items:center;margin-bottom:46px}
.mark{position:relative;width:84px;height:84px;margin-bottom:24px}
.m-inner{
  position:absolute;inset:9px;border-radius:50%;
  background:linear-gradient(145deg,#192b1d,#0e1710);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 28px rgba(0,0,0,0.6),0 0 0 1px rgba(37,211,102,0.12),inset 0 1px 0 rgba(255,255,255,0.05);
}
.m-letters{font-size:21px;font-weight:800;color:var(--wa);letter-spacing:-0.5px;line-height:1}
.m-ring{
  position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,var(--wa) 0deg,rgba(37,211,102,0.3) 60deg,transparent 120deg,transparent 360deg);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 1.8px),#000 calc(100% - 1.8px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 1.8px),#000 calc(100% - 1.8px));
  animation:rspin 10s linear infinite;
}
@keyframes rspin{to{transform:rotate(360deg)}}
.m-ping{
  position:absolute;inset:-5px;border-radius:50%;
  border:1px solid rgba(37,211,102,0.4);
  opacity:0;animation:mpng 3s ease-out infinite;
}
.m-ping2{
  position:absolute;inset:-12px;border-radius:50%;
  border:1px solid rgba(37,211,102,0.15);
  opacity:0;animation:mpng 3s ease-out 1.2s infinite;
}
@keyframes mpng{
  0%{opacity:0.6;transform:scale(1)}
  100%{opacity:0;transform:scale(1.4)}
}
.brand{
  font-size:27px;font-weight:800;letter-spacing:-0.8px;
  color:var(--snow);margin-bottom:10px;
}
.pill{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 15px;border-radius:99px;
  background:var(--wa-lo);border:1px solid var(--wa-md);
  font-size:10px;font-weight:600;color:var(--wa);
  letter-spacing:2px;text-transform:uppercase;
}
.pdot{
  width:5px;height:5px;border-radius:50%;
  background:var(--wa);box-shadow:0 0 8px var(--wa);
  animation:blink 2s ease infinite;flex-shrink:0;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
.links{width:100%;display:flex;flex-direction:column;gap:11px}
.lk{
  display:flex;align-items:center;gap:15px;
  padding:17px 18px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);
  text-decoration:none;color:var(--snow);
  position:relative;overflow:hidden;
  transition:border-color .25s,background .25s,transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .25s;
  opacity:0;animation:sup .5s ease forwards;
}
.lk:nth-child(1){animation-delay:.06s}
.lk:nth-child(2){animation-delay:.14s}
.lk:nth-child(3){animation-delay:.22s}
.lk:nth-child(4){animation-delay:.30s}
@keyframes sup{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.lk::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--wa),rgba(37,211,102,0.4));
  border-radius:0 3px 3px 0;
  transform:scaleY(0);transition:transform .22s cubic-bezier(.34,1.56,.64,1);
  transform-origin:center;
}
.lk:hover{
  border-color:rgba(37,211,102,0.25);background:var(--lift);
  transform:translateX(5px);
  box-shadow:0 8px 32px rgba(0,0,0,0.3),0 0 0 1px rgba(37,211,102,0.08);
}
.lk:hover::before{transform:scaleY(1)}
.lk:active{transform:translateX(2px) scale(0.99)}
.ico{
  width:44px;height:44px;border-radius:13px;
  background:var(--wa-lo);border:1px solid rgba(37,211,102,0.14);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:background .25s,border-color .25s,box-shadow .25s;
}
.lk:hover .ico{
  background:rgba(37,211,102,0.16);border-color:rgba(37,211,102,0.32);
  box-shadow:0 0 18px rgba(37,211,102,0.18);
}
.ico svg{width:21px;height:21px;fill:var(--wa);transition:filter .25s}
.lk:hover .ico svg{filter:drop-shadow(0 0 6px rgba(37,211,102,0.75))}
.tx{flex:1;min-width:0}
.tx-t{font-size:14px;font-weight:600;color:var(--snow);margin-bottom:2px;letter-spacing:.1px}
.tx-s{font-size:11px;font-weight:400;color:var(--dim);letter-spacing:.2px}
.ar{
  width:20px;height:20px;color:var(--dim);flex-shrink:0;
  transition:color .2s,transform .2s;
}
.lk:hover .ar{color:var(--wa);transform:translateX(4px)}
.foot{
  margin-top:52px;font-size:10px;font-weight:400;
  color:var(--dim);letter-spacing:2.5px;text-transform:uppercase;
}
</style>

<script>
(function(){
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  var W,H,stars=[],meteors=[],glows=[];
  var t=0;

  function resize(){
    W=cv.width=window.innerWidth;
    H=cv.height=window.innerHeight;
    initStars();
    initGlows();
  }

  function rnd(a,b){return a+Math.random()*(b-a);}

  function initStars(){
    stars=[];
    var n=Math.floor(W*H/3200);
    for(var i=0;i<n;i++){
      stars.push({
        x:rnd(0,W),y:rnd(0,H),
        r:rnd(0.25,1.4),
        base:rnd(0.08,0.55),
        phase:rnd(0,Math.PI*2),
        freq:rnd(0.004,0.012)
      });
    }
  }

  function initGlows(){
    glows=[
      {cx:W*0.5,cy:H*0.08,rx:W*0.55,ry:H*0.32,r:37,g:211,b:102,a:0,ta:0.055,phase:0,freq:0.0008},
      {cx:W*0.15,cy:H*0.6,rx:W*0.4,ry:H*0.35,r:20,g:80,b:255,a:0,ta:0.028,phase:Math.PI,freq:0.0006},
      {cx:W*0.88,cy:H*0.75,rx:W*0.38,ry:H*0.3,r:37,g:211,b:102,a:0,ta:0.018,phase:Math.PI*0.7,freq:0.0007}
    ];
  }

  function spawnMeteor(){
    var sx=rnd(W*0.1,W*0.9);
    var sy=rnd(-80,-20);
    var angle=rnd(0.4,0.65);
    var speed=rnd(7,14);
    meteors.push({
      x:sx,y:sy,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      len:rnd(90,200),
      life:1,
      decay:rnd(0.008,0.018),
      width:rnd(0.8,2)
    });
  }

  function drawBackground(){
    ctx.fillStyle='#05070d';
    ctx.fillRect(0,0,W,H);
  }

  function drawGlows(){
    glows.forEach(function(g){
      g.phase+=g.freq;
      var pulse=Math.sin(g.phase)*0.4+0.6;
      g.a=g.ta*pulse;
      var grd=ctx.createRadialGradient(g.cx,g.cy,0,g.cx,g.cy,Math.max(g.rx,g.ry));
      grd.addColorStop(0,'rgba('+g.r+','+g.g+','+g.b+','+g.a.toFixed(3)+')');
      grd.addColorStop(0.5,'rgba('+g.r+','+g.g+','+g.b+','+(g.a*0.3).toFixed(3)+')');
      grd.addColorStop(1,'rgba('+g.r+','+g.g+','+g.b+',0)');
      ctx.save();
      ctx.scale(g.rx/Math.max(g.rx,g.ry),g.ry/Math.max(g.rx,g.ry));
      ctx.fillStyle=grd;
      ctx.beginPath();
      ctx.arc(g.cx*(Math.max(g.rx,g.ry)/g.rx),g.cy*(Math.max(g.rx,g.ry)/g.ry),Math.max(g.rx,g.ry),0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    });
  }

  function drawStars(){
    stars.forEach(function(s){
      s.phase+=s.freq;
      var op=s.base+Math.sin(s.phase)*0.18;
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle='rgba(220,230,255,'+Math.max(0,op.toFixed(3))+')';
      ctx.fill();
    });
  }

  function drawMeteors(){
    meteors=meteors.filter(function(m){return m.life>0;});
    meteors.forEach(function(m){
      m.x+=m.vx;
      m.y+=m.vy;
      m.life-=m.decay;
      var tailX=m.x-m.vx*(m.len/m.width)*0.06;
      var tailY=m.y-m.vy*(m.len/m.width)*0.06;
      var grd=ctx.createLinearGradient(tailX,tailY,m.x,m.y);
      grd.addColorStop(0,'rgba(255,255,255,0)');
      grd.addColorStop(0.7,'rgba(180,240,210,'+( m.life*0.35).toFixed(3)+')');
      grd.addColorStop(1,'rgba(255,255,255,'+(m.life*0.95).toFixed(3)+')');
      ctx.beginPath();
      ctx.moveTo(tailX,tailY);
      ctx.lineTo(m.x,m.y);
      ctx.strokeStyle=grd;
      ctx.lineWidth=m.width*m.life;
      ctx.lineCap='round';
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(m.x,m.y,m.width*m.life*0.9,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,'+(m.life*0.9).toFixed(3)+')';
      ctx.fill();
    });
  }

  var lastMeteor=0;
  function loop(ts){
    t=ts;
    drawBackground();
    drawGlows();
    drawStars();
    drawMeteors();
    if(ts-lastMeteor>rnd(1800,4200)){
      spawnMeteor();
      lastMeteor=ts;
    }
    requestAnimationFrame(loop);
  }

  resize();
  window.addEventListener('resize',resize);
  requestAnimationFrame(loop);
})();
</script>
